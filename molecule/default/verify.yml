---
- name: Verify Alloy
  hosts: all
  become: true
  gather_facts: false

  vars:
    alloy_verify_units:
      - alloy.service

  tasks:
    - name: Verify that Alloy works
      block:
        # The role is not included in this playbook, so its defaults are not in
        # scope. Reading defaults/main.yml directly ties the version assertion
        # below.
        - name: Load the role defaults
          ansible.builtin.include_vars:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
            name: alloy_defaults

        - name: Wait for the Alloy systemd services to become active (up to 180s each)
          ansible.builtin.systemd_service:
            name: "{{ item }}"
          register: alloy_services
          until: alloy_services.status.ActiveState == 'active'
          retries: 36
          delay: 5
          loop: "{{ alloy_verify_units }}"
          # So that giving up is reported by the assertion below rather than as a
          # wall of systemd unit properties.
          failed_when: false

        # `Restart=always` in the systemd unit means that even a container which crashes
        # and gets restarted reads as active here, so this is a precondition rather than
        # a result.
        - name: Assert the Alloy systemd services are active
          ansible.builtin.assert:
            that: alloy_services.results | map(attribute='status.ActiveState') | unique | list == ['active']
            fail_msg: >-
              Not every service is active:
              {{ dict(alloy_verify_units | zip(alloy_services.results | map(attribute='status.ActiveState'))) }}
            success_msg: "Every systemd service is active"

        - name: Retrieve the Alloy systemd services log for debugging
          when: alloy_debug_service_enabled | bool
          ansible.builtin.command:
            cmd: "journalctl --no-pager --output=cat --unit={{ item }}"
          changed_when: false
          loop: "{{ alloy_verify_units }}"

        # A systemd unit reaching "active" only means that `docker start` has not
        # exited yet. This is the first thing the Alloy process itself has to
        # answer, so it is where a container that never got going shows up.
        - name: Wait for Alloy to report itself ready (up to 10m)
          ansible.builtin.uri:
            url: "http://localhost:12345/-/ready"
            method: GET
            return_content: true
          register: alloy_ready
          until: alloy_ready.status == 200
          retries: 120
          delay: 5

        - name: Assert Alloy reports itself ready
          ansible.builtin.assert:
            that: "'Alloy is ready' in alloy_ready.content"
            fail_msg: "Alloy did not report it was ready: {{ alloy_ready.content | default('no response') }}"
            success_msg: "Alloy reports itself ready"

        # Tying the running version to `alloy_version` is what makes this
        # scenario a real test of the version that Renovate bumps: a bump that
        # produces an unusable image cannot pass here.
        #
        # Alloy has no version API endpoint - the closest thing it offers over
        # HTTP is the `alloy_build_info` metric, whose `version` label carries
        # exactly what `alloy --version` prints.
        - name: Query the metrics exposed by the running Alloy
          ansible.builtin.uri:
            url: "http://localhost:12345/metrics"
            method: GET
            return_content: true
          register: alloy_metrics

        # A `[{]` character class rather than an escaped brace, because a `\{`
        # written in a block scalar here does not survive to the regex engine.
        - name: Determine the version reported by the running Alloy
          ansible.builtin.set_fact:
            alloy_reported_version: >-
              {{
                alloy_metrics.content
                | regex_search('alloy_build_info[{][^}]*version="([^"]+)"', '\1')
                | first | default('', true)
              }}

        # Both carry a leading `v` (`v1.22.0`), which is stripped on each side so
        # that the comparison does not depend on it.
        - name: Assert the running Alloy is the version this role installs
          ansible.builtin.assert:
            that: (alloy_reported_version | regex_replace('^v', '')) == (alloy_defaults.alloy_version | string | regex_replace('^v', ''))
            fail_msg: "Alloy reports {{ alloy_reported_version | default('none') }}, expected {{ alloy_defaults.alloy_version }}"
            success_msg: "Alloy reports {{ alloy_reported_version }}"

        # The components the role's configuration defines, read back out of the
        # running process rather than off disk. The stock grafana/alloy image ships
        # an /etc/alloy/config.alloy of its own, whose components are entirely
        # different (`prometheus.exporter.unix`, `prometheus.scrape`, ...), so
        # these - which only this role's template can produce - are what
        # distinguishes a configured Alloy from a merely running one.
        - name: Query the components the running Alloy loaded
          ansible.builtin.uri:
            url: "http://localhost:12345/api/v0/web/components"
            method: GET
            return_content: true
          register: alloy_components

        # The API does not label its response as JSON, so `uri` leaves it unparsed.
        - name: Determine the health of the role's components
          ansible.builtin.set_fact:
            alloy_component_health: >-
              {{
                dict(
                  alloy_components.content | from_json
                  | map(attribute='localID')
                  | zip(alloy_components.content | from_json | map(attribute='health') | map(attribute='state'))
                )
              }}

        - name: Assert the role's configuration reached the running Alloy
          ansible.builtin.assert:
            that:
              - alloy_component_health['loki.write.default'] | default('') == 'healthy'
              - alloy_component_health['loki.source.file.' ~ alloy_molecule_scraper_name] | default('') == 'healthy'
              # A direct statement that the stock configuration is not what is loaded.
              - "'prometheus.scrape.default' not in alloy_component_health"
            fail_msg: "The role's configuration did not reach Alloy: {{ alloy_component_health }}"
            success_msg: "The role's configuration reached Alloy"

        # Configuration reaching the process is still not the same as Alloy
        # having acted on it. This is the scraper the role's configuration asked
        # for, reported as reading the seeded file it resolved the glob to.
        - name: Query the files the role's scraper is reading
          ansible.builtin.uri:
            url: "http://localhost:12345/api/v0/web/components/loki.source.file.{{ alloy_molecule_scraper_name }}"
            method: GET
            return_content: true
          register: alloy_scraper
          until: >-
            (alloy_molecule_log_in_container_path ~ '/' ~ alloy_molecule_log_filename) in alloy_scraper.content
          retries: 24
          delay: 5

        - name: Assert Alloy reads the seeded log file the role pointed it at
          ansible.builtin.assert:
            that:
              - "(alloy_molecule_log_in_container_path ~ '/' ~ alloy_molecule_log_filename) in alloy_scraper.content"
            fail_msg: "Alloy did not report reading the seeded log file"
            success_msg: "Alloy reads the seeded log file the role pointed it at"

        # Everything above proves that Alloy is running, holds the role's
        # configuration and has opened the right file. This proves that it does its
        # job: the seeded line made it out of Alloy, across the network, and into
        # a Loki that can hand it back. Shipping is asynchronous and batched, so the
        # query is retried until the line shows up.
        - name: Wait for the seeded log line to arrive at Loki (up to 3m)
          ansible.builtin.uri:
            url: >-
              http://127.0.0.1:{{ alloy_molecule_loki_bind_port }}/loki/api/v1/query_range?limit=100&query={{
                ('{job="' ~ alloy_molecule_scraper_job_name ~ '"}') | urlencode
              }}
            method: GET
            return_content: true
          register: alloy_loki_query
          until: >-
            alloy_molecule_log_line in (
              alloy_loki_query.json.data.result | default([])
              | map(attribute='values') | flatten | join(' ')
            )
          retries: 36
          delay: 5

        - name: Determine the log lines Loki received from Alloy
          ansible.builtin.set_fact:
            alloy_delivered_lines: >-
              {{
                alloy_loki_query.json.data.result | default([])
                | map(attribute='values') | flatten | join(' ')
              }}
            alloy_delivered_stream_job: >-
              {{
                alloy_loki_query.json.data.result | default([])
                | map(attribute='stream.job') | first | default('', true)
              }}

        - name: Assert Alloy shipped the seeded log line to Loki
          ansible.builtin.assert:
            that:
              - alloy_loki_query.json.status == 'success'
              - alloy_molecule_log_line in alloy_delivered_lines
              - alloy_delivered_stream_job == alloy_molecule_scraper_job_name
            fail_msg: "The seeded log line did not reach Loki: {{ alloy_delivered_lines | default('nothing received') }}"
            success_msg: "Alloy shipped the seeded log line to Loki under the configured job label"

        - name: Verify nothing was quietly restarting while all of that was being checked
          when: "alloy_restarts_check_enabled | bool"
          block:
            # `Restart=always` means the unit reads `active` while it is crash-looping,
            # so `active` on its own says very little. The window has to be watched with
            # everything already answering.
            - name: Sample the restart counters
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: alloy_restarts_before
              loop: "{{ alloy_verify_units }}"

            # Comfortably longer than the unit's `RestartSec=30`, so a crash loop has to
            # tick at least once inside the window.
            - name: Watch the services for 45 seconds
              ansible.builtin.pause:
                seconds: 45

            - name: Sample the restart counters again
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: alloy_restarts_after
              loop: "{{ alloy_verify_units }}"

            - name: Assert no service restarted while it was up
              ansible.builtin.assert:
                that:
                  - alloy_restarts_after.results | map(attribute='status.NRestarts') | list == alloy_restarts_before.results | map(attribute='status.NRestarts') | list
                  - alloy_restarts_after.results | map(attribute='status.ActiveState') | unique | list == ['active']
                fail_msg: >-
                  A service restarted while it was supposedly up, so `active` was hiding a crash loop.
                  Before:
                  {% for unit, restarts in alloy_verify_units | zip(alloy_restarts_before.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %},
                  after:
                  {% for unit, restarts in alloy_verify_units | zip(alloy_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}
                success_msg: >-
                  None of the services restarted over 45 seconds of watching (restarts so far:
                  {% for unit, restarts in alloy_verify_units | zip(alloy_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %})

        - name: Show the Alloy verification summary
          ansible.builtin.debug:
            msg:
              - "Alloy systemd: {% for unit, state in alloy_verify_units | zip(alloy_services.results | map(attribute='status.ActiveState')) %}{{ unit }} ({{ state }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "Alloy restarts: {% for unit, restarts in alloy_verify_units | zip(alloy_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "Alloy version: {{ alloy_reported_version }}"
              - "Alloy scraper: {{ alloy_molecule_scraper_name }} (job {{ alloy_molecule_scraper_job_name }})"
              - "Alloy shipped to Loki under job: {{ alloy_delivered_stream_job }}"

      rescue:
        # Whatever went wrong, the reason is almost always in the systemd service log.
        - name: Retrieve the Alloy systemd service log
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=alloy.service
          register: alloy_service_log
          changed_when: false

        - name: Show the Alloy systemd service log
          ansible.builtin.debug:
            var: alloy_service_log.stdout_lines

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "Alloy verification failed. The systemd service log is printed above."
