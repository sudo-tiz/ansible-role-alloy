---
# Project source code URL: https://github.com/grafana/alloy

alloy_enabled: true

alloy_identifier: alloy
alloy_base_path: "/{{ alloy_identifier }}"
alloy_config_path: "{{ alloy_base_path }}/config"
alloy_data_path: "{{ alloy_base_path }}/data"

# renovate: datasource=docker depName=grafana/alloy versioning=semver
alloy_version: v1.22.0

alloy_uid: ""
alloy_gid: ""

# The hostname at which Alloy is served.
alloy_hostname: ""

# The path at which Alloy is served.
# This value must either be `/` or not end with a slash (e.g. `/alloy`).
alloy_path_prefix: '/'

alloy_container_image: "{{ alloy_container_image_registry_prefix }}grafana/alloy:{{ alloy_container_image_tag }}"
alloy_container_image_tag: "{{ alloy_version }}"
alloy_container_image_registry_prefix: "{{ alloy_container_image_registry_prefix_upstream }}"
alloy_container_image_registry_prefix_upstream: "{{ alloy_container_image_registry_prefix_upstream_default }}"
alloy_container_image_registry_prefix_upstream_default: docker.io/

# The base container network. It will be auto-created by this role if it doesn't exist already.
alloy_container_network: "{{ alloy_identifier }}"

# Control if the container network is deleted on uninstalling.
alloy_container_network_deletion_enabled: true

# Specify how the container publishes its HTTP port (as defined by `alloy_config_http_listen_port`).
#
# Takes an "<ip>:<port>" or "<port>" value (e.g. "127.0.0.1:12345"), or empty string to not expose.
alloy_container_http_host_bind_port: ""

# The HTTP port number in the container.
# Alloy serves its UI, API and /metrics endpoint all on this single port.
alloy_config_http_listen_port: 12345

# A list of additional container networks that the container would be connected to.
# The role does not create these networks, so make sure they already exist.
# Use this to expose this container to a reverse proxy, which runs in a different container network.
alloy_container_additional_networks: "{{ alloy_container_additional_networks_auto + alloy_container_additional_networks_custom }}"
alloy_container_additional_networks_auto: []
alloy_container_additional_networks_custom: []

# A list of additional "volumes" to mount in the container.
# This list gets populated dynamically at runtime. You can provide a different default value,
# if you wish to mount your own files into the container.
# Contains definition objects like this: `{"type": "bind", "src": "/outside", "dst": "/inside", "options": "readonly"}.
# See the `--mount` documentation for the `docker run` command.
alloy_container_additional_volumes: "{{ alloy_container_additional_volumes_default + alloy_container_additional_volumes_auto + alloy_container_additional_volumes_custom }}"
alloy_container_additional_volumes_default: |
  {{
    (alloy_journald_scraper_container_additional_volumes if alloy_journald_scrapers | length > 0 else [])
    +
    (alloy_varlog_scraper_container_additional_volumes if alloy_varlog_scrapers | length > 0 else [])
  }}
alloy_container_additional_volumes_auto: []
alloy_container_additional_volumes_custom: []

# alloy_container_labels_traefik_enabled controls whether labels to assist a Traefik reverse-proxy will be attached to the container.
# See `../templates/labels.j2` for details.
#
# To inject your own other container labels, see `alloy_container_labels_additional_labels_custom`.
alloy_container_labels_traefik_enabled: false
alloy_container_labels_traefik_docker_network: "{{ alloy_container_network }}"
alloy_container_labels_traefik_entrypoints: web-secure

# Controls if Alloy exposes its API (including a /metrics endpoint under it)
alloy_container_labels_traefik_api_enabled: false
alloy_container_labels_traefik_api_hostname: "{{ alloy_hostname }}"
# The path prefix must either be `/` or not end with a slash (e.g. `/alloy`).
alloy_container_labels_traefik_api_path_prefix: "{{ alloy_path_prefix }}"
alloy_container_labels_traefik_api_traefik_rule: "Host(`{{ alloy_container_labels_traefik_api_hostname }}`){% if alloy_container_labels_traefik_api_path_prefix != '/' %} && PathPrefix(`{{ alloy_container_labels_traefik_api_path_prefix }}`){% endif %}"
alloy_container_labels_traefik_api_traefik_priority: 0
alloy_container_labels_traefik_api_traefik_entrypoints: "{{ alloy_container_labels_traefik_entrypoints }}"
alloy_container_labels_traefik_api_traefik_tls: "{{ alloy_container_labels_traefik_entrypoints != 'web' }}"
alloy_container_labels_traefik_api_traefik_tls_certResolver: default  # noqa var-naming
alloy_container_labels_traefik_api_traefik_middleware_basic_auth_enabled: false
# See: https://doc.traefik.io/traefik/reference/routing-configuration/http/middlewares/basicauth/
alloy_container_labels_traefik_api_traefik_middleware_basic_auth_users: ""

# Controls if Alloy exposes its /metrics endpoint.
# We have dedicated labels for this, so that one could easily expose just the metrics while not exposing the whole API.
alloy_container_labels_traefik_metrics_enabled: false
alloy_container_labels_traefik_metrics_hostname: "{{ alloy_hostname }}"
# The path prefix must either be `/` or not end with a slash (e.g. `/metrics/alloy`).
alloy_container_labels_traefik_metrics_path_prefix: "{{ '' if alloy_path_prefix == '/' else alloy_path_prefix }}/metrics"
alloy_container_labels_traefik_metrics_traefik_rule: "Host(`{{ alloy_container_labels_traefik_metrics_hostname }}`){% if alloy_container_labels_traefik_metrics_path_prefix != '/' %} && Path(`{{ alloy_container_labels_traefik_metrics_path_prefix }}`){% endif %}"
alloy_container_labels_traefik_metrics_traefik_priority: 0
alloy_container_labels_traefik_metrics_traefik_entrypoints: "{{ alloy_container_labels_traefik_entrypoints }}"
alloy_container_labels_traefik_metrics_traefik_tls: "{{ alloy_container_labels_traefik_entrypoints != 'web' }}"
alloy_container_labels_traefik_metrics_traefik_tls_certResolver: default  # noqa var-naming
alloy_container_labels_traefik_metrics_traefik_middleware_basic_auth_enabled: false
# See: https://doc.traefik.io/traefik/reference/routing-configuration/http/middlewares/basicauth/
alloy_container_labels_traefik_metrics_traefik_middleware_basic_auth_users: ""

# alloy_container_labels_additional_labels contains a multiline string with additional labels to add to the container label file.
# See `../templates/labels.j2` for details.
# To add your own custom labels, use `alloy_container_labels_additional_labels_custom`
#
# Example:
# alloy_container_labels_additional_labels_custom:
#   - my.label=1
#   - another.label="here"
alloy_container_labels_additional_labels: "{{ alloy_container_labels_additional_labels_auto + alloy_container_labels_additional_labels_custom }}"
alloy_container_labels_additional_labels_auto: []
alloy_container_labels_additional_labels_custom: []

# A list of extra arguments to pass to the container (`docker create` command)
alloy_container_extra_arguments: "{{ alloy_container_extra_arguments_auto + alloy_container_extra_arguments_custom }}"
alloy_container_extra_arguments_auto: []
alloy_container_extra_arguments_custom: []

# A list of extra arguments to pass to the process inside the container.
alloy_process_extra_arguments: "{{ alloy_process_extra_arguments_auto + alloy_process_extra_arguments_custom }}"
alloy_process_extra_arguments_auto: []
alloy_process_extra_arguments_custom: []

# List of systemd services that the Alloy systemd service depends on
alloy_systemd_required_services_list: "{{ alloy_systemd_required_services_list_default + alloy_systemd_required_services_list_auto + alloy_systemd_required_services_list_custom }}"
alloy_systemd_required_services_list_default: "{{ [devture_systemd_docker_base_docker_service_name] if devture_systemd_docker_base_docker_service_name else [] }}"
alloy_systemd_required_services_list_auto: []
alloy_systemd_required_services_list_custom: []

# List of systemd services that the Alloy systemd service wants
alloy_systemd_wanted_services_list: "{{ alloy_systemd_wanted_services_list_default + alloy_systemd_wanted_services_list_auto + alloy_systemd_wanted_services_list_custom }}"
alloy_systemd_wanted_services_list_default: []
alloy_systemd_wanted_services_list_auto: []
alloy_systemd_wanted_services_list_custom: []

# Controls how long to wait for the container to stop gracefully before killing it.
alloy_container_stop_grace_time_seconds: "{{ devture_systemd_docker_base_container_stop_grace_time_seconds }}"

# Controls how long the pre-start cleanup should wait for stale container-name release
# before failing startup explicitly.
alloy_container_cleanup_timeout_seconds: "{{ devture_systemd_docker_base_container_cleanup_timeout_seconds }}"

# Controls the delay between pre-start cleanup retries.
alloy_container_cleanup_retry_delay_seconds: "{{ devture_systemd_docker_base_container_cleanup_retry_delay_seconds }}"

# Shell command used in the systemd pre-start phase to deterministically remove a stale
# container and wait until Docker releases its name.
alloy_container_cleanup_command: |
  i=0;
  while [ "$i" -lt {{ alloy_container_cleanup_timeout_seconds }} ]; do
  {{ devture_systemd_docker_base_host_command_docker }} stop -t {{ alloy_container_stop_grace_time_seconds }} {{ alloy_identifier }} >/dev/null 2>&1 || true;
  {{ devture_systemd_docker_base_host_command_docker }} rm -f {{ alloy_identifier }} >/dev/null 2>&1 || true;
  if {{ devture_systemd_docker_base_host_command_docker }} container inspect {{ alloy_identifier }} >/dev/null 2>&1; then
  i=$((i + 1));
  sleep {{ alloy_container_cleanup_retry_delay_seconds }};
  continue;
  fi;
  if {{ devture_systemd_docker_base_host_command_docker }} info >/dev/null 2>&1; then
  exit 0;
  fi;
  echo "Failed to query Docker daemon while cleaning up {{ alloy_identifier }}" >&2;
  exit 1;
  done;
  echo "Failed to remove stale container {{ alloy_identifier }} after {{ alloy_container_cleanup_timeout_seconds }} attempts" >&2;
  exit 1

# Controls whether to run with non-`root` privileges, as specified by `alloy_uid` and `alloy_gid`.
#
# Running as root is the default, because system logs are usually not accessible otherwise,
# even if additional capabilities are added (see `alloy_container_add_capability_*`).
# If you're scraping logs that Alloy would have access to, you can disable root access for increased security.
alloy_container_run_as_non_root_user_enabled: false

# Controls whether the CAP_DAC_OVERRIDE capability should be granted to the container.
# See: https://man7.org/linux/man-pages/man7/capabilities.7.html
alloy_container_add_capability_dac_override_enabled: true

# Controls whether the CAP_DAC_READ_SEARCH capability should be granted to the container.
# See: https://man7.org/linux/man-pages/man7/capabilities.7.html
alloy_container_add_capability_dac_read_search_enabled: true

alloy_container_capabilities_to_add: "{{ alloy_container_capabilities_to_add_default + alloy_container_capabilities_to_add_auto + alloy_container_capabilities_to_add_custom }}"
alloy_container_capabilities_to_add_default: |
  {{
    (
      (['DAC_OVERRIDE'] if alloy_container_add_capability_dac_override_enabled else [])
      +
      (['DAC_READ_SEARCH'] if alloy_container_add_capability_dac_read_search_enabled else [])
    ) | unique
  }}
alloy_container_capabilities_to_add_auto: []
alloy_container_capabilities_to_add_custom: []

# Alloy uses its own configuration language ("Alloy syntax"), made up of independent, composable components
# (e.g. `loki.source.journal`, `loki.write`, etc.), instead of Promtail's single monolithic YAML document.
# Because of this, extending the configuration works differently than with a YAML-based role: instead of
# recursively merging a dictionary, `alloy_configuration_extension_alloy` is simply appended as-is after
# `alloy_configuration_alloy`, so you can define additional components there.
#
# For a more advanced customization, you can extend the default (see `alloy_configuration_extension_alloy`)
# or completely replace this variable with your own template.
alloy_configuration_alloy: "{{ lookup('template', 'templates/config.alloy.j2') }}"

# alloy_configuration_extension_alloy contains extra Alloy configuration syntax which gets appended after
# `alloy_configuration_alloy`. Use this to define your own additional components (e.g. `prometheus.scrape`,
# `otelcol.receiver.otlp`, extra `loki.source.*` components, etc.), taking advantage of the fact that Alloy
# can do a lot more than just collect and forward logs like Promtail did.
#
# If you need something more special, you can take full control by completely redefining `alloy_configuration_alloy`.
alloy_configuration_extension_alloy: |
  // This configuration extends the default starting configuration (`alloy_configuration_alloy`).
  //
  // You can define additional Alloy components here (e.g. more `loki.source.*`, `prometheus.scrape`, `otelcol.*`, etc.).
  //
  // If you need something more special, you can take full control by
  // completely redefining `alloy_configuration_alloy`.

# Holds the final configuration (the default configuration, followed by its extension).
# You most likely don't need to touch this variable. Instead, see `alloy_configuration_alloy`.
alloy_configuration: "{{ alloy_configuration_alloy }}\n{{ alloy_configuration_extension_alloy }}"

# Controls the log level of Alloy's own logs (not the logs it collects).
# One of: debug, info, warn, error.
alloy_config_logging_level: info

# Controls the log format of Alloy's own logs (not the logs it collects).
# One of: logfmt, json.
alloy_config_logging_format: logfmt

# Specify the timezone
alloy_environment_variables_tz: UTC

# Additional environment variables.
alloy_environment_variables_additional_variables: ""

# alloy_restart_necessary controls whether the Alloy systemd
# service will be restarted (when true) or merely started (when false) by the
# systemd service manager role (when conditional restart is enabled).
#
# This value is automatically computed during installation based on whether
# any configuration files, the systemd service file, or the container image changed.
# The default of `false` means "no restart needed" — appropriate when the role's
# installation tasks haven't run (e.g., due to --tags skipping them).
alloy_restart_necessary: false

########################################################################
#                                                                      #
# journald scraper                                                     #
#                                                                      #
########################################################################

# Controls whether the default journald scraper entry (see `alloy_journald_scrapers_default`) is added.
# The systemd journal is only bind-mounted into the container when `alloy_journald_scrapers` ends up non-empty,
# so enabling this (or adding your own entries via `alloy_journald_scrapers_custom`) is what actually triggers the mount.
alloy_journald_scraper_enabled: false

alloy_journald_scraper_host_path: /var/log/journal
alloy_journald_scraper_in_container_path: /journal

alloy_journald_scraper_container_additional_volumes:
  - type: bind
    src: "{{ alloy_journald_scraper_host_path }}"
    dst: "{{ alloy_journald_scraper_in_container_path }}"
    options: readonly
  - type: bind
    src: /etc/machine-id
    dst: /etc/machine-id
    options: readonly

alloy_journald_scraper_config_journal_json: false
alloy_journald_scraper_config_journal_max_age: 12h
alloy_journald_scraper_config_journal_path: "{{ alloy_journald_scraper_in_container_path }}"

# With the default configuration below, Alloy will scrape every systemd-journald unit except itself.
# You can change this behavior by adjusting `alloy_journald_scraper_config_relabel_configs_drop_regex` and `alloy_journald_scraper_config_relabel_configs_keep_regex`.
#
# Note that dropping happens first. If you drop too much, you may not have anything left to keep.
#
# To avoid dropping anything and only rely on whitelisting (via `alloy_journald_scraper_config_relabel_configs_keep_regex`),
# consider setting `alloy_journald_scraper_config_relabel_configs_drop_regex` to a dummy regex that will never match,
# instead of unsetting it.
#
# Example: alloy_journald_scraper_config_relabel_configs_drop_regex: '{{ alloy_identifier }}\.service|another-ignored-unit\.service'
alloy_journald_scraper_config_relabel_configs_drop_regex: '{{ alloy_identifier }}\.service'
# Example: alloy_journald_scraper_config_relabel_configs_keep_regex: 'ssh\.service|fail2ban\.service|mash-.*'
alloy_journald_scraper_config_relabel_configs_keep_regex: '.*'

# Optional systemd journal field matches to filter entries at the source, using the `FIELD=VALUE` syntax
# (multiple space-separated matches are combined with a logical AND). Leave empty to not filter at all.
#
# See: https://grafana.com/docs/alloy/latest/reference/components/loki/loki.source.journal/#journal-matches
#
# Example: alloy_journald_scraper_config_matches: "_SYSTEMD_UNIT=nginx.service"
alloy_journald_scraper_config_matches: ""

# alloy_journald_scrapers is a list of independent journald scrapers, each one becoming its own pair of
# `loki.relabel` + `loki.source.journal` Alloy components (all reading from the same mounted systemd journal).
#
# This lets you go beyond the single simple scraper controlled by the basic options above, by adding your own
# entries with different `matches`/labels/relabeling/destination via `alloy_journald_scrapers_custom`, without
# having to redefine the whole configuration.
#
# Scraper names must be valid Alloy identifiers: letters, digits, or underscores; not starting with a digit.
# Each item supports the following keys:
# - name: a unique Alloy identifier for this scraper
# - json: whether journal entries should be forwarded as JSON (boolean)
# - max_age: the oldest relative time from which entries should be read
# - path: the in-container path to the mounted systemd journal directory
# - matches: optional `FIELD=VALUE` journal match expression (see `alloy_journald_scraper_config_matches` above)
# - labels: a dictionary of static labels to attach (e.g. `{job: "systemd-journal"}`)
# - relabel_drop_regex / relabel_keep_regex: same semantics as the basic options above, but per-scraper
# - relabel_rules_extra: optional raw Alloy syntax with additional `rule { ... }` blocks, appended after the built-in ones
# - forward_to: a list of raw Alloy component reference expressions to forward log entries to
#   (defaults to `['loki.write.default.receiver']`; override to route through your own `loki.process`/`loki.write`
#   components defined via `alloy_configuration_extension_alloy`)
#
# Example:
# alloy_journald_scrapers_custom:
#   - name: nginx_only
#     json: false
#     max_age: 12h
#     path: "{{ alloy_journald_scraper_in_container_path }}"
#     matches: ""
#     labels: { job: "nginx-journal" }
#     relabel_drop_regex: 'a-dummy-regex-that-never-matches'
#     relabel_keep_regex: 'nginx\.service'
#     relabel_rules_extra: ""
#     forward_to: ['loki.write.default.receiver']
alloy_journald_scrapers: "{{ alloy_journald_scrapers_default + alloy_journald_scrapers_auto + alloy_journald_scrapers_custom }}"
alloy_journald_scrapers_default: |
  {{
    ([{
      'name': 'journal',
      'json': alloy_journald_scraper_config_journal_json,
      'max_age': alloy_journald_scraper_config_journal_max_age,
      'path': alloy_journald_scraper_config_journal_path,
      'matches': alloy_journald_scraper_config_matches,
      'labels': {'job': 'systemd-journal'},
      'relabel_drop_regex': alloy_journald_scraper_config_relabel_configs_drop_regex,
      'relabel_keep_regex': alloy_journald_scraper_config_relabel_configs_keep_regex,
      'relabel_rules_extra': '',
      'forward_to': ['loki.write.default.receiver'],
    }] if alloy_journald_scraper_enabled else [])
  }}
alloy_journald_scrapers_auto: []
alloy_journald_scrapers_custom: []

########################################################################
#                                                                      #
# /journald scraper                                                    #
#                                                                      #
########################################################################

########################################################################
#                                                                      #
# varlog scraper                                                       #
#                                                                      #
########################################################################

# Controls whether the default varlog scraper entry (see `alloy_varlog_scrapers_default`) is added.
# `/var/log` is only bind-mounted into the container when `alloy_varlog_scrapers` ends up non-empty,
# so enabling this (or adding your own entries via `alloy_varlog_scrapers_custom`) is what actually triggers the mount.
alloy_varlog_scraper_enabled: false

alloy_varlog_scraper_host_path: /var/log
alloy_varlog_scraper_in_container_path: /varlog

alloy_varlog_scraper_container_additional_volumes:
  - type: bind
    src: "{{ alloy_varlog_scraper_host_path }}"
    dst: "{{ alloy_varlog_scraper_in_container_path }}"
    options: readonly

alloy_varlog_scraper_config_labels_path: "{{ alloy_varlog_scraper_in_container_path }}{{ alloy_varlog_scraper_config_labels_path_suffix }}"
alloy_varlog_scraper_config_labels_path_suffix: /**/*log
alloy_varlog_scraper_config_labels_path_exclude: "{{ alloy_varlog_scraper_in_container_path }}/**/{faillog,lastlog}"
alloy_varlog_scraper_config_labels_job: varlog
alloy_varlog_scraper_config_labels_host: "{{ inventory_hostname }}"

# How often Alloy re-syncs the filesystem to discover new/removed files matching the glob pattern above.
alloy_varlog_scraper_config_sync_period: 10s

# alloy_varlog_scrapers is a list of independent varlog scrapers, each one becoming its own `loki.source.file`
# Alloy component. All scrapers read from the same `/var/log` bind-mount (see `alloy_varlog_scraper_host_path`),
# so adding more entries (e.g. to scan a different sub-directory/glob pattern with different labels or a different
# destination) via `alloy_varlog_scrapers_custom` doesn't require any additional mounts.
#
# Scraper names must be valid Alloy identifiers: letters, digits, or underscores; not starting with a digit.
# Each item supports the following keys:
# - name: a unique Alloy identifier for this scraper
# - path: the in-container glob path to scan (e.g. `{{ alloy_varlog_scraper_in_container_path }}/nginx/*.log`)
# - path_exclude: optional in-container glob for paths to exclude (defaults to excluding `lastlog` and `faillog`)
# - labels: a dictionary of static labels to attach (e.g. `{job: "nginx", host: "{{ inventory_hostname }}"}`)
# - sync_period: how often to re-sync the filesystem for this scraper
# - forward_to: a list of raw Alloy component reference expressions to forward log entries to
#   (defaults to `['loki.write.default.receiver']`; override to route through your own `loki.process`/`loki.write`
#   components defined via `alloy_configuration_extension_alloy`)
#
# Example:
# alloy_varlog_scrapers_custom:
#   - name: nginx
#     path: "{{ alloy_varlog_scraper_in_container_path }}/nginx/*.log"
#     labels: { job: "nginx", host: "{{ inventory_hostname }}" }
#     sync_period: 10s
#     forward_to: ['loki.write.default.receiver']
alloy_varlog_scrapers: "{{ alloy_varlog_scrapers_default + alloy_varlog_scrapers_auto + alloy_varlog_scrapers_custom }}"
alloy_varlog_scrapers_default: |
  {{
    ([{
      'name': 'varlog',
      'path': alloy_varlog_scraper_config_labels_path,
      'path_exclude': alloy_varlog_scraper_config_labels_path_exclude,
      'labels': {'job': alloy_varlog_scraper_config_labels_job, 'host': alloy_varlog_scraper_config_labels_host},
      'sync_period': alloy_varlog_scraper_config_sync_period,
      'forward_to': ['loki.write.default.receiver'],
    }] if alloy_varlog_scraper_enabled else [])
  }}
alloy_varlog_scrapers_auto: []
alloy_varlog_scrapers_custom: []

########################################################################
#                                                                      #
# /varlog scraper                                                      #
#                                                                      #
########################################################################

# Clients config
#
# Each client definition results in an `endpoint` block being added to the `loki.write "default"` component.
#
# Supported keys:
# - url (required): the Loki push API URL to send logs to
# - tenant_id: value to pass as an X-Scope-OrgID HTTP header
# - basic_auth: `{username: "...", password: "..."}`
# - headers: a dictionary of additional HTTP headers to send with each request
# - tls_ca_file: path (inside the container) to a custom CA certificate to validate the endpoint's TLS certificate
# - tls_insecure_skip_verify: whether to skip TLS certificate verification (boolean)
#
# A basic client definition should look like this:
# alloy_config_clients_custom:
#   # Note the double /loki/loki.
#   # This assumes Loki is installed at a `/loki` path-prefix.
#   - url: https://mash.example.com/loki/loki/api/v1/push
#     tenant_id: "mash"
#
# A more advanced one, using basic auth and a custom header:
# alloy_config_clients_custom:
#   - url: https://loki.example.com/loki/api/v1/push
#     basic_auth:
#       username: "alloy"
#       password: "some-password"
#     headers:
#       X-My-Header: "some-value"
alloy_config_clients: "{{ alloy_config_clients_auto + alloy_config_clients_custom }}"
alloy_config_clients_auto: []
alloy_config_clients_custom: []
